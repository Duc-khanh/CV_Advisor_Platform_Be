spring.config.import=optional:file:.env[.properties]

spring.application.name=CvAdvisorPlatform
server.port=${PORT:8080}
# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/CvAdvisorPlatform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SQL Init
# ===============================
#spring.sql.init.mode=never
#spring.jpa.defer-datasource-initialization=true

# ... (Gi? nguy�n c�c ph?n c?u h�nh JWT, Google OAuth2, Mail, OpenRouter b�n d??i c?a b?n)

#


# ===============================
# File Upload
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:11MB}
#file.upload-dir=D:/uploads/jobs
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
cv.private-upload-dir=${CV_PRIVATE_UPLOAD_DIR:private-uploads/cv}
cv.application-upload-dir=${CV_APPLICATION_UPLOAD_DIR:private-uploads/applications}
app.settings-file=${APP_SETTINGS_FILE:config/system_settings.json}
# ===============================
# JWT Configuration
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ===============================
# SQL Init
# ===============================
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ===============================
# Google OAuth2
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===============================
# Mail Configuration
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# OpenRouter API Configuration
# ===============================
openrouter.api.key=${CVADVISOR_OPENROUTER_API_KEY}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.api.model=google/gemini-3.1-flash-lite

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

# Payment endpoints are locked down by default.
app.payment.simulation-enabled=${PAYMENT_SIMULATION_ENABLED:false}
app.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}
app.payment.bank-id=${PAYMENT_BANK_ID:MB}
app.payment.bank-name=${PAYMENT_BANK_NAME:Ngân hàng TMCP Quân Đội (MB Bank)}
app.payment.account-no=${PAYMENT_ACCOUNT_NO:}
app.payment.account-name=${PAYMENT_ACCOUNT_NAME:}

# Deployment health check
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never




