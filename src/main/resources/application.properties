spring.application.name=CvAdvisorPlatform
# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/CvAdvisorPlatform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:linhnhi234}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ===============================
# JPA / Hibernate
# ===============================
# Ch?n 'none' ?? gi? nguyên c?u trúc b?ng d? li?u m?u b?n import b?ng DBeaver t? file dump
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# ===============================
# SQL Init
# ===============================
#spring.sql.init.mode=never
